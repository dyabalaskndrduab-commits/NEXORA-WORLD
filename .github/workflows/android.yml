name: Android debug APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js for backend tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test backend room authority
        working-directory: backend
        run: npm test && node --check src/server.js
      - name: Set up Python for avatar asset
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate detailed NEXORA avatar GLB
        run: |
          python -m pip install --disable-pip-version-check numpy trimesh
          python tools/build_nexora_avatar.py
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run unit tests and build debug APK
        run: gradle testDebugUnitTest assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexora-world-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
