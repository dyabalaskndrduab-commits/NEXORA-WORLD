name: Android debug APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "automation/open-city-expansion-20261121", "automation/android-social-client-20261126" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nexora_world
          POSTGRES_USER: nexora_ci
          POSTGRES_PASSWORD: nexora_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexora_ci -d nexora_world"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js for backend tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies and test persistence
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://nexora_ci:nexora_ci_password@localhost:5432/nexora_world
          DATABASE_SSL: disable
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run migrate
          npm run test:integration
          node --check src/server.js
          node --check src/account-store.js
          node --check src/migrate.js
      - name: Set up Python for avatar asset
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate detailed NEXORA avatar GLB
        run: |
          python -m pip install --disable-pip-version-check numpy trimesh
          python tools/build_nexora_avatar.py
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run unit tests and build debug APK
        run: gradle testDebugUnitTest assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexora-world-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Package complete source project
        run: |
          zip -r nexora-world-source.zip . \
            -x ".git/*" "*/.git/*" "*/build/*" ".gradle/*" "*/.gradle/*" "nexora-world-source.zip" "backend/node_modules/*" "backend/.env"
      - name: Upload source project
        uses: actions/upload-artifact@v4
        with:
          name: nexora-world-source
          path: nexora-world-source.zip
